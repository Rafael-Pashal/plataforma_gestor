name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_hml:
        description: "Implantar o commit atual de main em HML"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore PlataformaGestor.sln -p:NuGetAuditLevel=High
      - run: dotnet list PlataformaGestor.sln package --vulnerable --include-transitive
      - run: dotnet build PlataformaGestor.sln --configuration Release --no-restore
      - run: dotnet test PlataformaGestor.sln --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*', cache: npm, cache-dependency-path: src/frontend/package-lock.json }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install --disable-pip-version-check -r .github/requirements-sast.txt
      - run: semgrep scan --config p/default --error --severity ERROR --metrics=off

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install and verify Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location "${release}/${archive}" --output "${RUNNER_TEMP}/${archive}"
          curl --fail --silent --show-error --location "${release}/gitleaks_${version}_checksums.txt" --output "${RUNNER_TEMP}/gitleaks_checksums.txt"
          cd "${RUNNER_TEMP}"
          grep -F "${archive}" gitleaks_checksums.txt | sha256sum --check --status
          tar -xzf "${archive}" gitleaks
          ./gitleaks git --redact --exit-code 1 "${GITHUB_WORKSPACE}"

  build-images:
    runs-on: ubuntu-latest
    needs: [backend, frontend, sast, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable deployment images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose --file compose.yaml build api-dev web-dev
      - name: Export images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker save "plataforma-gestor-api:${IMAGE_TAG}" "plataforma-gestor-web:${IMAGE_TAG}" \
            | gzip --fast > "${RUNNER_TEMP}/plataforma-gestor-images.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: plataforma-gestor-images-${{ github.sha }}
          path: ${{ runner.temp }}/plataforma-gestor-images.tar.gz
          retention-days: 7

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, plataforma-gestor-deploy]
    needs: [backend, frontend, sast, secret-scan, build-images]
    environment: dev
    concurrency:
      group: plataforma-gestor-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install --disable-pip-version-check -r infra/ansible/requirements.txt
      - run: ansible-playbook --inventory infra/ansible/inventory.ini infra/ansible/site.yml
      - uses: actions/download-artifact@v4
        with:
          name: plataforma-gestor-images-${{ github.sha }}
          path: ${{ runner.temp }}
      - run: gzip --decompress --stdout "${RUNNER_TEMP}/plataforma-gestor-images.tar.gz" | docker load
      - name: Deploy DEV
        env:
          DEPLOY_BIND_ADDRESS: 192.168.97.221
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose --project-name plataforma-gestor-dev --file compose.yaml up --detach --no-build api-dev web-dev
      - name: Smoke test DEV
        run: bash scripts/smoke.sh 192.168.97.221 8081 5080
      - name: Show DEV logs after failure
        if: failure()
        run: docker compose --project-name plataforma-gestor-dev --file compose.yaml logs --no-color --tail 100 api-dev web-dev

  deploy-hml:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_hml && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, plataforma-gestor-deploy]
    needs: [backend, frontend, sast, secret-scan, build-images]
    environment: hml
    concurrency:
      group: plataforma-gestor-hml
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install --disable-pip-version-check -r infra/ansible/requirements.txt
      - run: ansible-playbook --inventory infra/ansible/inventory.ini infra/ansible/site.yml
      - uses: actions/download-artifact@v4
        with:
          name: plataforma-gestor-images-${{ github.sha }}
          path: ${{ runner.temp }}
      - run: gzip --decompress --stdout "${RUNNER_TEMP}/plataforma-gestor-images.tar.gz" | docker load
      - name: Deploy HML
        env:
          DEPLOY_BIND_ADDRESS: 192.168.97.221
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose --project-name plataforma-gestor-hml --file compose.yaml up --detach --no-build api-hml web-hml
      - name: Smoke test HML
        run: bash scripts/smoke.sh 192.168.97.221 8082 5081
      - name: Show HML logs after failure
        if: failure()
        run: docker compose --project-name plataforma-gestor-hml --file compose.yaml logs --no-color --tail 100 api-hml web-hml
