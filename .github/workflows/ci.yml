name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore PlataformaGestor.sln
      - run: dotnet build PlataformaGestor.sln --configuration Release --no-restore
      - run: dotnet test PlataformaGestor.sln --configuration Release --no-build
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*', cache: npm, cache-dependency-path: src/frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
